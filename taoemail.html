<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài tập HTML + JS</title>
</head>
<body>
    <form>
        <label>
            Họ tên:
            <input type="text" name="username" id="fullname">
        </label>
        <label>
            Mã sinh viên:
            <input type="text" name="MSV" id="studentid">
        </label>
        <button type="button" onclick="xuly()">OK</button>
    </form>
    <h3>Kết quả</h3>
    <p id="kq"></p>
    <script>
        function xuly(){
            let fullName = document.getElementById("fullname").value.trim();
            let studentId = document.getElementById("studentid").value.trim();
            let facultyCode = studentId.substring(2,6);
            let faculty="";
            switch (facultyCode) {
                case "A401":
                    faculty = "Ngân hàng";
                    break;
                case "A402":
                    faculty = "Kế toán và kiểm toán";
                    break;
                case "A403":
                    faculty = "Quản trị kinh doanh";
                    break;
                case "A404":
                    faculty = "Công nghệ thông tin và kinh tế số";
                    break;
                case "A405":
                    faculty = "Kinh doanh quốc tế";
                    break;
                case "A406":
                    faculty = "Luật";
                    break;
                case "A407":
                    faculty = "Kinh tế";
                    break;
                case "A408":
                    faculty = "Khoa học dữ liệu";
                    break;
                case "A751":
                    faculty = "Ngôn ngữ";
                    break;
                default:
                    faculty = "Không xác định";
            }
            let arr = fullName.toLowerCase().split(" ");
            let ten = arr[arr.length - 1]; 
            let ho = arr[0]; 
            let dem= "";
            for(let i=1;i<arr.length-1;i++){
                dem+=arr[i].charAt(0);
            }
            
            let email = ten + ho.charAt(0) +dem+"."+studentId+ "@hvnh.edu.vn";
            let coursePeriod = studentId.substring(0, 2);


            let last4 = studentId.substring(studentId.length - 4);
            let sum = 0;
            for (let i = 0; i < last4.length; i++) {
                sum += parseInt(last4[i]);
            }

        
            document.getElementById("kq").innerHTML =
            "Email: " + email + "<br>" +
            "Xin chào " + fullName +
            ", bạn là sinh viên khóa " + coursePeriod +
            ", khoa " + faculty + ", mã sinh viên "+studentId+
            ", tổng 4 số cuối là " + sum;
        }
            
        
    </script>

</body>
</html>
