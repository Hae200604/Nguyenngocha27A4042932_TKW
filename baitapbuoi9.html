<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài tập HTML + JS</title>
</head>
<body>

    <h2>Thông tin sinh viên</h2>

    <label>Họ tên (không dấu):
    <input type="text" id="fullName" name="username">
    </label>

    <label>Mã sinh viên:
    <input type="text" id="studentId"  name="studentid">
    </label>
    <label>
        Khoa:
        <input type="text" id="khoa" name="faculty">
    </label>

    <button onclick="xuLy()">Ok</button>

    <h3>Kết quả:</h3>
    <p id="kq"></p>

    <script>
        function xuLy() {
            let fullName = document.getElementById("fullName").value.trim();
            let studentId = document.getElementById("studentId").value.trim();
            let faculty = document.getElementById("khoa").value.trim();
            let arr = fullName.toLowerCase().split(" ");
            let ten = arr[arr.length - 1]; 
            let ho = arr[0]; 
            let dem= arr[1];
            
            let email = ten + ho.charAt(0) +dem.charAt(0)+ "@hvnh.edu.vn";
            let coursePeriod = studentId.substring(0, 2);


            let last4 = studentId.substring(studentId.length - 4);
            let sum = 0;
            for (let i = 0; i < last4.length; i++) {
                sum += parseInt(last4[i]);
            }

        
            document.getElementById("kq").innerHTML =
            "Email: " + email + "<br>" +
            "Xin chào " + fullName +
            ", bạn là sinh viên khóa " + coursePeriod +
            ", khoa " + faculty +
            ", tổng 4 số cuối là " + sum;

            
        }
    </script>

</body>
</html>
